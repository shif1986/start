[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Cette valeur publique n'est injectee que dans le build de production.
# Les previews et le staging doivent conserver leur propre origine canonique.
[context.production.environment]
  VITE_PUBLIC_SITE_URL = "https://startreseauchretien.com"

# Le domaine www doit être déclaré comme alias du site dans Netlify.
[[redirects]]
  from = "https://www.startreseauchretien.com/*"
  to = "https://startreseauchretien.com/:splat"
  status = 301
  force = true

# React Router traite uniquement les routes applicatives connues côté navigateur.
# Le dernier fallback sert une vraie 404 aux chemins inconnus sans casser les
# routes dynamiques des annonces, profils et espaces authentifiés.
[[redirects]]
  from = "/annonces"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/annonce/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/professionnel/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/a-propos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/don"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/publier"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/publier/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/categories"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/connexion"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/inscription"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mot-de-passe-oublie"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/espace/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/abonnement"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/conditions-utilisation"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/conditions-abonnement"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/signaler-un-contenu"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"

  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=()"

# Les ressources Vite sont nommées avec une empreinte de contenu.
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Toujours revalider les fichiers qui peuvent changer entre deux déploiements.
[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
