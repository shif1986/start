<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Page introuvable — START Réseau Chrétien</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f6f0e4; background: #0d1016; }
      main { width: min(680px, 100%); padding: clamp(32px, 7vw, 72px); text-align: center; border: 1px solid rgba(246, 240, 228, .14); border-radius: 28px; background: #171a21; }
      p:first-child { margin: 0 0 18px; color: #d4ae60; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); }
      p { color: rgba(246, 240, 228, .72); line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
      a { padding: 13px 20px; border: 1px solid rgba(246, 240, 228, .2); border-radius: 12px; color: inherit; font-weight: 700; text-decoration: none; }
      a:first-child { color: #11151d; border-color: #d4ae60; background: #d4ae60; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>Erreur 404</p>
      <h1>Page introuvable</h1>
      <p>Cette page n’existe pas ou n’est plus disponible.</p>
      <nav aria-label="Navigation de retour">
        <a href="/">Retour à l’accueil</a>
        <a href="/annonces">Voir les annonces</a>
      </nav>
    </main>
  </body>
</html>
