name: Recette HTTP après déploiement

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement GitHub protégé
        required: true
        type: choice
        options: [staging, production]
      base_url:
        description: URL HTTPS à vérifier, sans chemin
        required: true
        type: string
      expect_sitemap:
        description: Exiger sitemap.xml
        required: true
        default: false
        type: boolean
      expect_404:
        description: Exiger une vraie réponse HTTP 404 pour une route inconnue
        required: true
        default: false
        type: boolean
      expect_security_headers:
        description: Exiger les en-têtes HTTP de sécurité de production
        required: true
        default: false
        type: boolean
      canonical_origin:
        description: Origine HTTPS attendue dans le sitemap (facultatif)
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Vérifier ${{ inputs.base_url }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vérifier les pages publiques
        env:
          START_EXPECT_SITEMAP: ${{ inputs.expect_sitemap && '1' || '0' }}
          START_EXPECT_404: ${{ inputs.expect_404 && '1' || '0' }}
          START_EXPECT_SECURITY_HEADERS: ${{ inputs.expect_security_headers && '1' || '0' }}
          START_EXPECT_CANONICAL_ORIGIN: ${{ inputs.canonical_origin }}
        run: node scripts/smoke-deployment.mjs "${{ inputs.base_url }}"
