name: Déployer les migrations Supabase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement GitHub protégé à cibler
        required: true
        type: choice
        options: [staging, production]
      scope:
        description: Portée du déploiement
        required: true
        default: customer_portal_only
        type: choice
        options: [customer_portal_only, full]

permissions:
  contents: read

concurrency:
  group: supabase-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrations ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Relier le projet
        if: inputs.scope == 'full'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --workdir backend
      - name: Vérifier les migrations prévues
        if: inputs.scope == 'full'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --workdir backend
      - name: Appliquer les migrations
        if: inputs.scope == 'full'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --workdir backend
      - name: Déployer les fonctions de facturation
        if: inputs.scope == 'full'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-subscription-checkout --workdir backend
          supabase functions deploy create-customer-portal --workdir backend
          supabase functions deploy create-donation-checkout --workdir backend
          supabase functions deploy get-donation-status --workdir backend
          supabase functions deploy stripe-webhook --workdir backend
      - name: Déployer le portail Stripe et la récupération associée
        if: inputs.scope == 'customer_portal_only'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-customer-portal --project-ref "ybfjjuznkfaftudtysge" --workdir backend
          supabase functions deploy reset-unmatched-stripe-subscription --project-ref "ybfjjuznkfaftudtysge" --workdir backend
